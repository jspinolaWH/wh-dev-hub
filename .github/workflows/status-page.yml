# Publishes status-page/ to GitHub Pages. The page reads the hub's live
# heartbeat from the `status` branch whenever someone opens it, so this only
# has to run when the page itself changes.
name: Status page

on:
  push:
    branches: [main]
    paths: [status-page/**, .github/workflows/status-page.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The branch must match statusPage.branch in the hub's config (default "status").
      - name: Point the page at this repo's heartbeat
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          printf '{"repo":"%s","branch":"status","defaultBranch":"%s"}\n' \
            "$GITHUB_REPOSITORY" "${DEFAULT_BRANCH:-main}" > status-page/config.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: status-page

      - id: deployment
        uses: actions/deploy-pages@v5
